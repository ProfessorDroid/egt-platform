info:
  title: EGT B2B API
  description: Eagle Goods Trading Co. — sourcing & export backend API (v1)
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    RegisterDto:
      type: object
      properties:
        email:
          type: string
          example: buyer@example.com
        password:
          type: string
          minLength: 10
          example: Strong#Pass123
        fullName:
          type: string
          example: Aman Buyer
        phone:
          type: string
          example: "+919876609948"
        companyName:
          type: string
          example: Acme Imports Ltd
        role:
          type: string
          enum:
            - buyer
            - supplier
          default: buyer
      required:
        - email
        - password
        - fullName
    VerifyEmailDto:
      type: object
      properties:
        token:
          type: string
      required:
        - token
    LoginDto:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    RefreshDto:
      type: object
      properties:
        refreshToken:
          type: string
          description: Raw refresh token issued at login/rotation.
      required:
        - refreshToken
    ForgotPasswordDto:
      type: object
      properties:
        email:
          type: string
      required:
        - email
    ResetPasswordDto:
      type: object
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 10
      required:
        - token
        - newPassword
    UpdateMeDto:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
    CreateCompanyDto:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum:
            - buyer
            - supplier
            - both
          default: buyer
        country:
          type: string
        city:
          type: string
        website:
          type: string
      required:
        - name
    CreateAddressDto:
      type: object
      properties:
        label:
          type: string
          default: Head office
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string
        isDefault:
          type: boolean
          default: false
      required:
        - line1
        - city
        - country
    UpdateProductDto:
      type: object
      properties:
        name:
          type: string
        shortDescription:
          type: string
        orderVolume:
          type: string
        isActive:
          type: boolean
        isFeatured:
          type: boolean
        sortOrder:
          type: number
    CreateSupplierDto:
      type: object
      properties:
        companyId:
          type: string
        capabilities:
          type: string
      required:
        - companyId
    CreateSupplierProductDto:
      type: object
      properties:
        productId:
          type: string
        customName:
          type: string
        customDescription:
          type: string
    ReviewSupplierProductDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - approved
            - changes_required
            - rejected
        reviewNote:
          type: string
      required:
        - status
    CreateRfqItemDto:
      type: object
      properties:
        productId:
          type: string
          description: Catalogue product id (omit for custom "we source it" items)
        customName:
          type: string
        customDetails:
          type: string
        quantity:
          type: number
        unit:
          type: string
          default: units
      required:
        - quantity
    CreateRfqDto:
      type: object
      properties:
        contactName:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        destinationCountry:
          type: string
        destinationCity:
          type: string
        deliveryAddress:
          type: string
        shippingPreference:
          type: string
          enum:
            - buyer_freight
            - egt_turnkey_freight
        currency:
          type: string
          default: USD
        budget:
          type: number
        targetPrice:
          type: number
        privateLabel:
          type: boolean
          default: false
        packagingPreference:
          type: string
        requirementDetails:
          type: string
          minLength: 15
        items:
          type: array
          items:
            $ref: "#/components/schemas/CreateRfqItemDto"
      required:
        - contactName
        - contactEmail
        - contactPhone
        - destinationCountry
        - requirementDetails
        - items
    TransitionRfqDto:
      type: object
      properties:
        to:
          type: string
          enum:
            - under_review
            - sourcing
            - supplier_matched
            - sample_discussion
            - quotation_ready
            - buyer_action_required
            - approved
            - order_processing
            - completed
            - closed
      required:
        - to
    CreatePrivateLabelDto:
      type: object
      properties:
        rfqId:
          type: string
        brandName:
          type: string
        designNotes:
          type: string
      required:
        - rfqId
    TransitionPlDto:
      type: object
      properties:
        to:
          type: string
          enum:
            - design_review
            - sample
            - approval
            - production
            - completed
      required:
        - to
    RegisterTokenDto:
      type: object
      properties:
        token:
          type: string
        platform:
          type: string
          enum:
            - android
            - ios
            - web
      required:
        - token
        - platform
    UpdatePreferenceDto:
      type: object
      properties:
        enabled:
          type: boolean
      required:
        - enabled
    CreateQuoteItemDto:
      type: object
      properties:
        productId:
          type: string
        description:
          type: string
        quantity:
          type: number
        unit:
          type: string
          default: units
        unitPrice:
          type: number
      required:
        - description
        - quantity
        - unitPrice
    CreateQuoteDto:
      type: object
      properties:
        rfqId:
          type: string
        currency:
          type: string
          default: USD
        shippingCost:
          type: number
        incoterm:
          type: string
          enum:
            - FOB
            - CIF
            - DDP
            - EXW
        validUntil:
          type: string
          description: ISO date the quote remains valid until
        notes:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/CreateQuoteItemDto"
      required:
        - rfqId
        - validUntil
        - items
    RejectQuoteDto:
      type: object
      properties:
        reason:
          type: string
    UpdateOrderStatusDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - confirmed
            - in_production
            - ready_to_ship
            - shipped
            - delivered
            - cancelled
      required:
        - status
    CreateShipmentDto:
      type: object
      properties:
        orderId:
          type: string
        carrier:
          type: string
        trackingRef:
          type: string
        originPort:
          type: string
        destinationPort:
          type: string
        estimatedDelivery:
          type: string
      required:
        - orderId
    AddEventDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - picked_up
            - in_transit
            - customs
            - out_for_delivery
            - delivered
            - exception
        location:
          type: string
        note:
          type: string
      required:
        - status
    CreateConversationDto:
      type: object
      properties:
        kind:
          type: string
          enum:
            - rfq
            - order
            - shipment
            - support_ticket
        rfqId:
          type: string
        orderId:
          type: string
        shipmentId:
          type: string
        ticketId:
          type: string
        subject:
          type: string
      required:
        - kind
    SendMessageDto:
      type: object
      properties:
        body:
          type: string
      required:
        - body
    CreateTicketDto:
      type: object
      properties:
        subject:
          type: string
        body:
          type: string
        priority:
          type: string
          enum:
            - low
            - medium
            - high
            - urgent
          default: medium
      required:
        - subject
        - body
    ReplyTicketDto:
      type: object
      properties:
        body:
          type: string
      required:
        - body
    UpdateTicketDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - open
            - in_progress
            - waiting_on_customer
            - resolved
            - closed
        priority:
          type: string
          enum:
            - low
            - medium
            - high
            - urgent
        assigneeId:
          type: string
    ChangeRoleDto:
      type: object
      properties:
        role:
          type: string
          enum:
            - buyer
            - supplier
            - staff
            - admin
      required:
        - role
