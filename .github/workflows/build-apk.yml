name: Build EGT Android APK (Direct Share)

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavor (staging or production)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
  push:
    branches: [ main ]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true
      
      - name: Get Flutter dependencies
        run: flutter pub get
      
      - name: Analyze (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
      
      - name: Run tests
        run: flutter test
      
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.EGT_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ../keystore
          echo "$KEYSTORE_BASE64" | base64 -d > ../keystore/egt-release.jks
          echo "Keystore decoded"
      
      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EGT_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.EGT_KEY_PASSWORD }}
        run: |
          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=egt-release
          storeFile=../../keystore/egt-release.jks
          EOF
          echo "key.properties created"
      
      - name: Build staging APK
        if: inputs.flavor == 'staging' || inputs.flavor == ''
        run: flutter build apk --release --flavor staging -t lib/main_staging.dart
      
      - name: Build production APK
        if: inputs.flavor == 'production'
        run: flutter build apk --release --flavor production -t lib/main_production.dart
      
      - name: Get APK info
        id: apk-info
        run: |
          APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          APK_SIZE=$(stat -c%s "$APK_PATH")
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          APK_NAME=$(basename "$APK_PATH")
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          # SHA-256 checksum
          SHA256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          echo "apk_sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "Built: $APK_NAME ($APK_SIZE bytes, SHA256: $SHA256)"
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: egt-app-${{ inputs.flavor || 'staging' }}-apk
          path: ${{ steps.apk-info.outputs.apk_path }}
          retention-days: 30
      
      - name: Build summary
        run: |
          echo "## EGT APK Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Flavor:** ${{ inputs.flavor || 'staging' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APK:** ${{ steps.apk-info.outputs.apk_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Size:** ${{ steps.apk-info.outputs.apk_size }} bytes" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-256:** \`${{ steps.apk-info.outputs.apk_sha256 }}\`" >> $GITHUB_STEP_SUMMARY
