# EGT API — nginx reverse proxy for staging-api.eaglegoodstrading.com
# Install: cp nginx-staging-api.conf /etc/nginx/sites-available/egt-api
#          ln -s /etc/nginx/sites-available/egt-api /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx
# Then: certbot --nginx -d staging-api.eaglegoodstrading.com

limit_req_zone $binary_remote_addr zone=egt_api:10m rate=30r/s;

upstream egt_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name staging-api.eaglegoodstrading.com;

    # Uploads: RFQ documents, product images, supplier docs
    client_max_body_size 12m;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # API docs (Swagger) — staging only; remove for prod or gate by IP
    location /api/docs {
        limit_req zone=egt_api burst=20 nodelay;
        proxy_pass http://egt_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=egt_api burst=60 nodelay;
        proxy_pass http://egt_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/egt-api-access.log;
    error_log  /var/log/nginx/egt-api-error.log;
}
