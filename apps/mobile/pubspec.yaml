name: egt_mobile
description: Eagle Goods Trading Co. — B2B sourcing & export mobile app (Flutter).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State
  flutter_riverpod: ^2.5.1
  # Navigation + deep links
  go_router: ^14.2.0
  # Networking
  dio: ^5.4.3
  # Secure storage (tokens) + prefs
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  # Push (STRUCTURE ONLY — no keys bundled; see docs/mobile-build.md)
  firebase_core: ^15.1.0
  firebase_messaging: ^15.1.5
  # Biometric unlock
  local_auth: ^2.1.8
  # Media / files
  image_picker: ^1.1.2
  file_picker: ^8.0.0
  share_plus: ^10.1.2
  cached_network_image: ^3.3.1
  path_provider: ^2.1.4
  # Connectivity (offline banner)
  connectivity_plus: ^6.0.5
  # External links (tel:, WhatsApp, maps)
  url_launcher: ^6.3.0
  # JWT expiry checks (no verification — signature verified server-side)
  jwt_decode: ^0.3.1
  # Formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - lib/l10n/
